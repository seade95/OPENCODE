<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — EduVerse</title>
<meta name="description" content="Sign in to your EduVerse school admin portal.">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f0f4ff,#e0e7ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.08);width:100%;max-width:440px;padding:40px 32px;}
.login-card .logo{text-align:center;margin-bottom:24px;}
.login-card .logo img{height:40px;width:auto;}
.login-card .logo span{font-size:22px;font-weight:800;color:#1e293b;margin-left:8px;vertical-align:middle;}
.login-card h1{font-size:22px;text-align:center;color:#1e293b;margin-bottom:4px;}
.login-card .subtitle{text-align:center;color:#64748b;font-size:14px;margin-bottom:24px;}
.admin-badge{display:flex;align-items:center;justify-content:center;gap:8px;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:10px;padding:10px;font-size:14px;font-weight:600;margin-bottom:20px;}
.admin-badge i{font-size:16px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:4px;}
.form-group input{width:100%;padding:11px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;transition:border-color .15s;}
.form-group input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;}
.form-row label{display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer;}
.form-row input[type=checkbox]{width:auto;}
.form-row a{color:#2563eb;text-decoration:none;}
.form-row a:hover{text-decoration:underline;}
.login-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff;transition:background .15s;}
.login-btn:hover{background:#1d4ed8;}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;}
.error{background:#fef2f2;color:#dc2626;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;}
.back-link{text-align:center;margin-top:20px;font-size:13px;}
.back-link a{color:#64748b;text-decoration:none;}
.back-link a:hover{color:#2563eb;}
@media(max-width:400px){.login-card{padding:28px 20px;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/firebase-config.js"></script>
<script>
var SESSION_KEY = 'eduverse_session';
var SESSION_VERSION = 1;

var FB_READY = false;
function initLoginFirebase() {
  if (typeof firebase !== 'undefined' && !FB_READY) {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      FB_READY = true;
    } catch(e) {}
  }
}
initLoginFirebase();

function getData() {
  try {
    var schoolParam = new URLSearchParams(window.location.search).get('school');
    if (schoolParam) {
      var tenants = JSON.parse(localStorage.getItem('eduverse_tenants')) || [];
      var tenant = tenants.find(function(t) { return t.slug === schoolParam; });
      if (tenant) {
        var key = 'schoolData_' + tenant.id;
        var raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      }
    }
  } catch(e) {}
  return JSON.parse(localStorage.getItem('eduverse_data')) || {};
}

function findUser(role, idOrEmail, password) {
  var data = getData();
  var users = [];
  if (role === 'student') users = data.students || [];
  else if (role === 'teacher') users = data.teachers || [];
  else if (role === 'admin') users = data.admins || [];
  var idField = role === 'parent' ? 'email' : 'id';
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    if ((u[idField] === idOrEmail || u.username === idOrEmail || u.email === idOrEmail) && u.password === password) {
      return u;
    }
  }
  return null;
}

function setLSession(type, user, tenantId) {
  var s = {
    version: SESSION_VERSION,
    type: type,
    user: { id: user.id, name: user.name, email: user.email || '', username: user.username || '', password: user.password || '' },
    timestamp: Date.now(),
    initialLogin: Date.now(),
    tenantId: tenantId || null
  };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {}
}

function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginError');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
  err.style.display = 'none';

  var idEl = document.getElementById('email');
  var pwEl = document.getElementById('password');
  if (!idEl || !pwEl) { showError('Please fill in all fields'); return; }
  var idVal = idEl.value.trim();
  var pwVal = pwEl.value.trim();
  var roleId = 'admin';

  if (!idVal || !pwVal) { showError('Please fill in all fields'); return; }

  if (FB_READY && idVal.indexOf('@') !== -1) {
    firebase.auth().signInWithEmailAndPassword(idVal, pwVal).then(function(cred) {
      if (typeof firebaseGetUserProfile === 'function') {
        return firebaseGetUserProfile(cred.user.uid);
      }
      return null;
    }).then(function(profile) {
      var schoolParam = new URLSearchParams(window.location.search).get('school');
      var user = { id: idVal, name: (profile ? profile.name : idVal), email: idVal, username: idVal, password: pwVal };
      setLSession(roleId, user, schoolParam || null);
      if (schoolParam) {
        window.location.href = 'index.html?school=' + encodeURIComponent(schoolParam) + '&portal=' + roleId;
      } else {
        window.location.href = 'index.html?login=' + roleId;
      }
    }).catch(function(authErr) {
      doLocalLogin(roleId, idVal, pwVal);
    });
  } else {
    doLocalLogin(roleId, idVal, pwVal);
  }
}

function doLocalLogin(roleId, idVal, pwVal) {
  setTimeout(function() {
    var user = findUser(roleId, idVal, pwVal);
    if (user) {
      var schoolParam = new URLSearchParams(window.location.search).get('school');
      setLSession(roleId, user, schoolParam || null);
      // Asynchronously ensure Firebase Auth user exists
      if (typeof window.ensureFirebaseUser === 'function') {
        try {
          window.ensureFirebaseUser(user.email || idVal, pwVal, user.name || idVal, roleId, schoolParam || null, user.id).catch(function(_e) {
            console.warn('Firebase auth provisioning skipped:', _e.code || _e.message);
          });
        } catch(_e) {}
      }
      if (roleId === 'admin' && user.forcePasswordChange) {
        showForcePasswordChange(user, idVal, pwVal);
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').innerHTML = 'Sign In';
        return;
      }
      var target;
      if (schoolParam) {
        target = 'index.html?school=' + encodeURIComponent(schoolParam) + '&portal=' + roleId;
      } else if (roleId === 'admin') {
        try {
          var _schools = JSON.parse(localStorage.getItem('eduverse_schools')) || [];
          var _match = _schools.find(function(s) { return s.adminEmail === (user.email || ''); });
          if (_match) {
            var _s = { version: 1, type: 'admin', user: { email: user.email, name: user.name }, timestamp: Date.now(), loginTime: Date.now(), schoolId: _match.id };
            localStorage.setItem('eduverse_session', JSON.stringify(_s));
            target = 'school-dashboard.html';
          } else {
            target = 'index.html?login=' + roleId;
          }
        } catch(e) { target = 'index.html?login=' + roleId; }
      } else {
        target = 'index.html?login=' + roleId;
      }
      window.location.href = target;
    } else {
      showError('Invalid credentials. Please check your ID/email and password.');
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').innerHTML = 'Sign In';
    }
  }, 400);
}

function showForcePasswordChange(user, idVal, oldPass) {
  var card = document.querySelector('.login-card');
  card.innerHTML = '<div class="logo"><a href="index.html" style="text-decoration:none;color:inherit;"><img src="icons/icon.svg" alt="EduVerse" onerror="this.style.display=\'none\'"><span>EduVerse</span></a></div>'
    + '<h1>Change Password</h1>'
    + '<p class="subtitle">This is your first login. Please set a new password.</p>'
    + '<div class="error" id="pwChangeError"></div>'
    + '<form onsubmit="event.preventDefault();doForcePasswordChange(\'' + user.id + '\',\'' + idVal.replace(/'/g,"\\'") + '\',\'' + oldPass.replace(/'/g,"\\'") + '\')">'
    + '<div class="form-group"><label>New Password</label><input type="password" id="newPw1" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password"></div>'
    + '<div class="form-group"><label>Confirm New Password</label><input type="password" id="newPw2" placeholder="Repeat password" required minlength="6" autocomplete="new-password"></div>'
    + '<button type="submit" class="login-btn" id="pwChangeBtn">Update Password</button></form>'
    + '<div class="back-link">    <a href="javascript:;" data-action="reloadPage"><i class="fas fa-arrow-left"></i> Back to Login</a></div>';
}

function doForcePasswordChange(adminId, idVal, oldPass) {
  var p1 = document.getElementById('newPw1').value;
  var p2 = document.getElementById('newPw2').value;
  var err = document.getElementById('pwChangeError');
  if (!p1 || p1.length < 6) { err.textContent = 'Password must be at least 6 characters'; err.style.display = 'block'; return; }
  if (p1 !== p2) { err.textContent = 'Passwords do not match'; err.style.display = 'block'; return; }
  var data = getData();
  var admin = (data.admins || []).find(function(a) { return a.id === adminId; });
  if (!admin) { err.textContent = 'Session expired. Please log in again.'; err.style.display = 'block'; return; }
  admin.password = p1;
  admin.forcePasswordChange = false;
  // Save to the correct key — per-school if school param present, else flat eduverse_data
  var schoolParam = new URLSearchParams(window.location.search).get('school');
  if (schoolParam) {
    try {
      var tenants = JSON.parse(localStorage.getItem('eduverse_tenants')) || [];
      var tenant = tenants.find(function(t) { return t.slug === schoolParam; });
      if (tenant) localStorage.setItem('schoolData_' + tenant.id, JSON.stringify(data));
    } catch(e) {}
  } else {
    localStorage.setItem('eduverse_data', JSON.stringify(data));
  }
  setLSession('admin', admin);
  // Update Firebase Auth password if possible
  if (typeof window.firebaseSignIn !== 'undefined') {
    try {
      firebase.auth().signInWithEmailAndPassword(admin.email, oldPass).then(function(cred) {
        cred.user.updatePassword(p1).catch(function() {});
      }).catch(function() {
        // User might not have Firebase Auth yet — try to provision
        if (typeof window.ensureFirebaseUser === 'function') {
          window.ensureFirebaseUser(admin.email, p1, admin.name, 'admin', null, admin.id).catch(function(_e) {
            console.warn('[FirebaseAuth] Password-change provision failed for', admin.email, _e.code || _e.message);
          });
        }
      });
    } catch(e) {}
  }
  if (schoolParam) {
    window.location.href = 'index.html?school=' + encodeURIComponent(schoolParam) + '&portal=admin';
  } else {
    window.location.href = 'index.html?login=admin';
  }
}

function showError(msg) {
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  err.textContent = msg;
  err.style.display = 'block';
  btn.disabled = false;
  btn.innerHTML = 'Sign In';
}

(function() {
  var params = new URLSearchParams(window.location.search);
  var schoolParam = params.get('school');

  // Auto-redirect if already logged in — skip login form
  var existing = (function() { try { var r = localStorage.getItem('eduverse_session'); return r ? JSON.parse(r) : null; } catch(e) { return null; } })();
  if (existing && existing.version === 1 && existing.type) {
    var target;
    if (existing.schoolId) {
      target = 'school-dashboard.html';
    } else if (schoolParam) {
      target = 'index.html?school=' + encodeURIComponent(schoolParam) + '&portal=' + existing.type;
    } else {
      target = 'index.html?login=' + existing.type;
    }
    window.location.href = target;
    return;
  }

  // School-branded login
  if (schoolParam) {
    try {
      var tenants = JSON.parse(localStorage.getItem('eduverse_tenants')) || [];
      var tenant = tenants.find(function(t) { return t.slug === schoolParam; });
      if (tenant) {
        var logoEl = document.querySelector('.login-card .logo span');
        var titleEl = document.querySelector('.login-card h1');
        if (logoEl) logoEl.textContent = tenant.name;
        if (titleEl) titleEl.textContent = 'Sign in to ' + tenant.name;
        var logoImg = document.querySelector('.login-card .logo img');
        if (logoImg && tenant.logo) logoImg.src = tenant.logo;
        document.title = tenant.name + ' — Sign In';
      }
    } catch(e) {}
    // Always redirect back arrow to school profile when school param is present
    var backLink = document.getElementById('loginBackLink');
    if (backLink) backLink.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Home';
    if (backLink) backLink.href = 'index.html?school=' + encodeURIComponent(schoolParam);
  }

})();
</script>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <a href="index.html" style="text-decoration:none;color:inherit;">
    <img src="icons/icon.svg" alt="EduVerse" onerror="this.style.display='none'">
    <span>EduVerse</span>
    </a>
  </div>
  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to your account</p>

  <div class="admin-badge"><i class="fas fa-user-shield"></i> Admin Portal</div>

  <div class="error" id="loginError"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="email" placeholder="admin@school.edu" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>
    <div class="form-row">
      <label><input type="checkbox" id="rememberMe" checked> Remember me</label>
      <a href="javascript:;" data-action="alertForgotPassword">Forgot password?</a>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
  </form>

  <div class="back-link">
    <a id="loginBackLink" href="index.html"><i class="fas fa-arrow-left"></i> Back to EduVerse</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;

  // Check if this is a school admin from an approved application
  var isSchoolAdmin = false;
  var schoolId = null;
  try {
    var schools = JSON.parse(localStorage.getItem('eduverse_schools')) || [];
    var match = schools.find(function(s) { return s.adminEmail === email; });
    if (match) { isSchoolAdmin = true; schoolId = match.id; }
  } catch(e) {}

  // Save session in format compatible with getSession() (ui.js), syncSession(), school-dashboard, and EduVerseAuth
  localStorage.setItem('eduverse_session', JSON.stringify({
    version: 1,
    type: 'admin',
    role: 'admin',
    email: email,
    user: { email: email },
    loginTime: Date.now(),
    schoolId: schoolId
  }));

  // Asynchronously ensure Firebase Auth user exists (fire-and-forget)
  if (typeof window.ensureFirebaseUser === 'function') {
    window.ensureFirebaseUser(email, password, email, 'admin', null, null).catch(function(_err) {
      console.warn('Firebase auth provisioning skipped (non-blocking):', _err.code || _err.message);
    });
  }

  // Redirect — school admins go to school-dashboard, others go to admin
  window.location.href = isSchoolAdmin ? 'school-dashboard.html' : 'admin.html';
});
</script>
<script src="js/events.js"></script>

</body>
</html>
