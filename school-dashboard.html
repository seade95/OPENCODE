<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Dashboard — EduVerse</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left img{height:32px;width:auto}
.topbar-left h1{font-size:1.1rem;font-weight:700;color:#1e293b}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-right .school-name{font-size:0.9rem;font-weight:600;color:#2563eb}
.container{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.05);display:flex;align-items:center;gap:14px}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-value{font-size:24px;font-weight:700;line-height:1.2;color:#1e293b}
.stat-label{font-size:13px;color:#718096}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.05);margin-bottom:16px}
.card h2{font-size:1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.link-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:10px;border:1px solid #e2e8f0;text-decoration:none;color:#1e293b;transition:all .2s}
.link-card:hover{border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,0.1)}
.link-card i{font-size:22px;width:24px;text-align:center;color:#2563eb}
.link-card span{font-size:0.9rem;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-outline{background:transparent;border:2px solid #e2e8f0;color:#475569}
.btn-outline:hover{border-color:#dc2626;color:#dc2626}
.empty{text-align:center;padding:40px;color:#718096;font-size:14px}
@media(max-width:600px){.container{padding:16px}.topbar{padding:10px 16px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img src="icons/icon.svg" alt="EduVerse">
    <h1>EduVerse</h1>
  </div>
  <div class="topbar-right">
    <span class="school-name" id="schoolNameDisplay"></span>
    <button class="btn btn-outline" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
  </div>
</div>

<div class="container">
  <div id="welcomeMsg" style="margin-bottom:16px;font-size:1.1rem;font-weight:600;color:#1e293b"></div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-icon" style="background:#dbeafe;color:#2563eb"><i class="fas fa-user-graduate"></i></div>
      <div><div class="stat-value" id="statStudents">0</div><div class="stat-label">Students</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#d1fae5;color:#059669"><i class="fas fa-chalkboard-teacher"></i></div>
      <div><div class="stat-value" id="statTeachers">0</div><div class="stat-label">Teachers</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef3c7;color:#d97706"><i class="fas fa-book"></i></div>
      <div><div class="stat-value" id="statClasses">0</div><div class="stat-label">Classes</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#ede9fe;color:#7c3aed"><i class="fas fa-users"></i></div>
      <div><div class="stat-value" id="statAdmins">0</div><div class="stat-label">Admins</div></div>
    </div>
  </div>

  <div class="card">
    <h2><i class="fas fa-external-link-alt" style="color:#2563eb"></i> Quick Links</h2>
    <div class="links-grid">
      <a href="admin.html" class="link-card"><i class="fas fa-cog"></i><span>Admin Panel</span></a>
      <a href="login.html" class="link-card"><i class="fas fa-sign-in-alt"></i><span>Login Page</span></a>
      <a id="sdHomeLink" href="javascript:;" onclick="var s=(function(){try{return location.search.match(/school=([^&]+)/)[1]}catch(e){return null}})();window.location.href=s?'school-portal.html?school='+encodeURIComponent(s):'index.html'" class="link-card"><i class="fas fa-home"></i><span>Home</span></a>
    </div>
  </div>

  <div class="card" id="infoCard">
    <h2><i class="fas fa-info-circle" style="color:#2563eb"></i> School Information</h2>
    <div id="schoolInfo" class="empty">Loading...</div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
var SCHOOL_KEY = 'eduverse_schools';

function getSchools() {
  try { return JSON.parse(localStorage.getItem(SCHOOL_KEY)) || []; } catch(e) { return []; }
}

function getSession() {
  try {
    var raw = localStorage.getItem('eduverse_session');
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.email) return null;
    return s;
  } catch(e) { return null; }
}

function doLogout() {
  localStorage.removeItem('eduverse_session');
  if (typeof EduVerseAuth !== 'undefined' && EduVerseAuth.logout) {
    EduVerseAuth.logout();
  } else {
    window.location.href = 'login.html';
  }
}

(function() {
  var session = getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  var schools = getSchools();
  var school = null;

  if (session.schoolId) {
    school = schools.find(function(s) { return s.id === session.schoolId; });
  }
  if (!school && session.email) {
    school = schools.find(function(s) { return s.adminEmail === session.email; });
  }

  if (!school) {
    document.getElementById('schoolNameDisplay').textContent = session.email;
    document.getElementById('welcomeMsg').textContent = 'Welcome, ' + (session.email || 'Admin');
    document.getElementById('schoolInfo').innerHTML = 'Your school account was not found. Please contact support.';
    return;
  }

  // Fix Home link to point to school profile if slug is available
  (function(){try{
    var at = localStorage.getItem('activeTenant');
    var tenants = JSON.parse(localStorage.getItem('eduverse_tenants') || '[]');
    var t = at ? tenants.find(function(x){return x.id===at}) : null;
    if (!t) t = tenants.find(function(x){return x.name===school.name});
    if (t && t.slug) {
      var hl = document.getElementById('sdHomeLink');
      if (hl) hl.href = '/?school=' + encodeURIComponent(t.slug);
    }
  }catch(e){}})();

  document.getElementById('schoolNameDisplay').textContent = school.schoolName;
  document.getElementById('welcomeMsg').textContent = 'Welcome to ' + school.schoolName;

  var info = document.getElementById('schoolInfo');
  info.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">'
    + '<div><strong>School:</strong> ' + (school.schoolName || '-') + '</div>'
    + '<div><strong>Contact:</strong> ' + (school.contactName || '-') + '</div>'
    + '<div><strong>Email:</strong> ' + (school.adminEmail || school.email || '-') + '</div>'
    + '<div><strong>Phone:</strong> ' + (school.phone || '-') + '</div>'
    + '<div><strong>City:</strong> ' + (school.city || '-') + '</div>'
    + '<div><strong>Approved:</strong> ' + (school.approvedAt ? new Date(school.approvedAt).toLocaleDateString() : '-') + '</div>'
    + '</div>';

  try {
    var tenantId = school.tenantId || school.id;
    var dataKey = 'schoolData_' + tenantId;
    var raw = localStorage.getItem(dataKey);
    if (raw) {
      var d = JSON.parse(raw);
      document.getElementById('statStudents').textContent = (d.students || []).length;
      document.getElementById('statTeachers').textContent = (d.teachers || []).length;
      document.getElementById('statClasses').textContent = (d.classes || []).length;
      document.getElementById('statAdmins').textContent = (d.admins || []).length;
    }
  } catch(e) {}
})();
</script>
</body>
</html>
