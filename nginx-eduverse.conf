# EduVerse - Nginx Server Block Configuration with Wildcard Subdomain Support
# Place in /etc/nginx/sites-available/eduverse (Linux)
# or in your Nginx conf.d directory
#
# IMPORTANT: Add a wildcard DNS A record (*.yourdomain.com) pointing to your server IP.
# DNS config:  *.yourdomain.com  IN  A  <server-ip>

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com *.yourdomain.com;

    # Root directory where index.html lives
    root /var/www/eduverse;
    index index.html;

    # Gzip compression for faster loads
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Route /superadmin to superadmin.html
    location = /superadmin {
        try_files /superadmin.html =404;
    }

    location = /superadmin/ {
        try_files /superadmin.html =404;
    }

    # Serve index.html for the root and all SPA routes
    # If the requested file or directory doesn't exist, serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML files — no aggressive cache
    location ~* \.html$ {
        add_header Cache-Control "private, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to sensitive files
    location ~ (^#|~$|\.bak$|\.swp$|\.sql$|\.log$) {
        deny all;
        return 404;
    }

    # Force HTTPS (uncomment after SSL certificate is installed)
    # return 301 https://$server_name$request_uri;
}

