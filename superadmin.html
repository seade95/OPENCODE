<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin — EduVerse</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyClI13ldpl8UkwhQQvnB8OG0bKdk9YgdLE",
  authDomain: "eduverse-508a7.firebaseapp.com",
  projectId: "eduverse-508a7",
  storageBucket: "eduverse-508a7.firebasestorage.app",
  messagingSenderId: "500067704675",
  appId: "1:500067704675:web:22e033dd77d39580dabd56",
  measurementId: "G-M5DYNJHW44"

firebase.initializeApp(FIREBASE_CONFIG);
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f0f4f8;min-height:100vh}

/* Login page */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f2440,#1a3a5c);padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-card h2{text-align:center;margin-bottom:8px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:10px}
.login-card h2 i{color:#f5a623}
.login-card p{text-align:center;color:#718096;font-size:14px;margin-bottom:24px}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#2d3748}
.form-group input{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#2563eb}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-success{background:#059669;color:#fff}
.btn-success:hover{background:#047857}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-outline{background:transparent;border:2px solid #e2e8f0;color:#475569}
.btn-outline:hover{border-color:#2563eb;color:#2563eb}
.btn-sm{padding:6px 12px;font-size:12px}

/* Utilities */
.error-box{display:none;background:#fed7d7;color:#c53030;padding:10px;border-radius:6px;margin-bottom:12px;font-size:13px}
.footer-link{text-align:center;margin-top:16px;font-size:13px;color:#718096}
.footer-link a{color:#2563eb;font-weight:600;text-decoration:none;cursor:pointer}
.footer-link a:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-approved{background:#d1fae5;color:#065f46}
.badge-rejected{background:#fee2e2;color:#991b1b}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.15);display:flex;align-items:center;gap:8px;animation:slideIn .3s ease;max-width:400px}
.toast-success{background:#d1fae5;color:#065f46;border-left:4px solid #059669}
.toast-error{background:#fee2e2;color:#991b1b;border-left:4px solid #dc2626}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Modal (used by SA dashboard) */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;width:95vw;max-width:1400px;max-height:90vh;overflow:hidden;padding:0;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#718096;line-height:1;z-index:10}
.modal-close:hover{color:#2d3748}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.empty-state{text-align:center;padding:40px 20px;color:#718096}
.empty-state i{font-size:40px;margin-bottom:12px;opacity:0.4}
.empty-state p{font-size:14px}

/* Credentials box (used by approval modals) */
.cred-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin:12px 0;font-family:monospace;font-size:14px;line-height:1.6}
.cred-box strong{color:#2563eb}
</style>
</head>
<body>

<div id="root"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Shared modules in dependency order -->
<script src="js/data.js"></script>
<script src="js/schoolprofile.js"></script>
<script src="js/ui.js"></script>
<script src="js/multitenant.js"></script>
<script src="js/superadmin.js"></script>

<!-- Auth + Login + Init -->
<script>
var _lastAuthError = null;

// --- Login form ---
function showLogin() {
  _lastAuthError = _lastAuthError || null;
  document.getElementById('root').innerHTML =
    '<div class="login-page">'
    + '<div class="login-card">'
    + '<h2><i class="fas fa-user-shield"></i> Super Admin</h2>'
    + '<p>Sign in to manage the platform</p>'
    + '<div id="loginError" class="error-box"' + (_lastAuthError ? '' : '') + '>' + (_lastAuthError || '') + '</div>'
    + '<div class="form-group"><label>Email</label><input type="email" id="saEmail" placeholder="super@eduverse.com"></div>'
    + '<div class="form-group"><label>Password</label><input type="password" id="saPass" placeholder="Enter password"></div>'
    + '<button class="btn btn-primary" onclick="handleLogin()" style="width:100%;margin-top:8px"><i class="fas fa-arrow-right"></i> Sign In</button>'
    + '<div class="footer-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to EduVerse</a></div>'
    + '</div></div>';
  if (_lastAuthError) {
    document.getElementById('loginError').style.display = 'block';
    _lastAuthError = null;
  }
}

// --- Login handler ---
function handleLogin() {
  var email = document.getElementById('saEmail').value.trim();
  var pass = document.getElementById('saPass').value.trim();
  var err = document.getElementById('loginError');
  if (!email || !pass) { err.textContent = 'Please fill all fields'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  var btn = document.querySelector('.btn-primary');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
  btn.disabled = true;
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .catch(function(error) {
      err.textContent = error.message || 'Invalid email or password';
      err.style.display = 'block';
      btn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
      btn.disabled = false;
    });
}

// --- Override: close SA dashboard also signs out ---
function closeSaDashboard() {
  var overlay = document.getElementById('modalOverlay');
  if (overlay) {
    overlay.classList.remove('active');
    overlay.style.overflowY = '';
  }
  firebase.auth().signOut();
}

// --- Init: show loading, then react to auth state ---
document.getElementById('root').innerHTML = '<div class="login-page"><div class="login-card"><p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Loading...</p></div></div>';

var _authCheckTimer = setTimeout(function() {
  if (document.getElementById('root').querySelector('.fa-spinner')) {
    firebase.auth().signOut();
  }
}, 10000);

firebase.auth().onAuthStateChanged(function(user) {
  clearTimeout(_authCheckTimer);
  if (user) {
    document.getElementById('root').innerHTML = '<div class="login-page"><div class="login-card"><p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Verifying credentials...</p></div></div>';
    firebase.firestore().doc('superAdmin/config').get()
      .then(function() {
        localStorage.setItem(SUPER_ADMIN_KEY, JSON.stringify({
          id: 'SUP001', name: user.email, email: user.email,
          super_admin_level: 'super', createdAt: new Date().toISOString()
        }));
        showSuperAdminDashboard();
      })
      .catch(function() {
        _lastAuthError = 'Not authorized as super admin';
        firebase.auth().signOut();
      });
  } else {
    showLogin();
  }
});
</script>
</body>
</html>
