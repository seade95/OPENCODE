<script>
// SA session persistence — login stays alive for 24h
var SA_SESSION_KEY = 'eduverse_sa_session';
var SA_SESSION_TTL = 24 * 60 * 60 * 1000;

function saveSASession(id) {
  try { localStorage.setItem(SA_SESSION_KEY, JSON.stringify({ id: id, loginTime: Date.now() })); } catch(e) {}
}

function getSASession() {
  try {
    var raw = localStorage.getItem(SA_SESSION_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.id && s.loginTime && Date.now() - s.loginTime < SA_SESSION_TTL) return s;
    }
  } catch(e) {}
  return null;
}

function clearSASession() {
  try { localStorage.removeItem(SA_SESSION_KEY); } catch(e) {}
}

// Override showSuperAdminLogin to render inline on standalone page
var _origShowSuperAdminLogin = showSuperAdminLogin;
showSuperAdminLogin = function() {
  clearSASession();
  var root = document.getElementById('saStandaloneRoot');
  if (!root) { _origShowSuperAdminLogin(); return; }
  root.innerHTML = '<div class="sa-login-page" id="saLoginPage">'
    + '<div class="sa-login-card">'
    + '<h2><i class="fas fa-user-shield"></i> Super Admin</h2>'
    + '<p>Sign in to manage all schools on the platform</p>'
    + '<div id="superAdminLoginError" class="error-box"></div>'
    + '<div class="form-group"><label>Email</label><input type="email" id="supAdminEmail" placeholder="super@eduverse.com" oninput="validateField(this,\'email\')"></div>'
    + '<div class="form-group"><label>Password</label><input type="password" id="supAdminPass" placeholder="Enter password" oninput="validateField(this,\'password\')"></div>'
    + '<button class="btn btn-primary" onclick="superAdminLogin()" style="width:100%;margin-top:8px;"><i class="fas fa-arrow-right"></i> Sign In</button>'
    + '<div class="footer-link">No account? <a onclick="showSuperAdminSignup()">Create One</a></div>'
    + '<div class="footer-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to EDUVERSE</a></div>'
    + '</div></div>';
};

// Override showSuperAdminSignup to render inline on standalone page
var _origShowSuperAdminSignup = showSuperAdminSignup;
showSuperAdminSignup = function() {
  clearSASession();
  if (getSuperAdmin()) {
    toast('A super admin already exists. Please login.', 'error');
    showSuperAdminLogin();
    return;
  }
  var root = document.getElementById('saStandaloneRoot');
  if (!root) { _origShowSuperAdminSignup(); return; }
  root.innerHTML = '<div class="sa-signup-page" id="saSignupPage">'
    + '<div class="sa-login-card">'
    + '<h2><i class="fas fa-user-shield"></i> Create Super Admin</h2>'
    + '<p>Set up the platform administrator account</p>'
    + '<div id="superAdminSignupError" class="error-box"></div>'
    + '<div class="form-group"><label>Full Name</label><input type="text" id="supAdminName" placeholder="Super admin name" oninput="validateField(this,\'name\')"></div>'
    + '<div class="form-group"><label>Email</label><input type="email" id="supAdminEmail" placeholder="super@eduverse.com" oninput="validateField(this,\'email\')"></div>'
    + '<div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="supAdminPass" placeholder="Min 6 characters" oninput="validateField(this,\'password\')"></div>'
    + '<button class="btn btn-success" onclick="createSuperAdminAccount()" style="width:100%;margin-top:8px;"><i class="fas fa-user-plus"></i> Create Account</button>'
    + '<div class="footer-link"><a onclick="showSuperAdminLogin()"><i class="fas fa-arrow-left"></i> Back to login</a></div>'
    + '</div></div>';
};

// Override showSuperAdminDashboard to render inline on standalone page
var _origShowSuperAdminDashboard = showSuperAdminDashboard;
showSuperAdminDashboard = function() {
  var admin = getSuperAdmin();
  if (!admin) { showSuperAdminLogin(); return; }
  saveSASession(admin.id);
  var root = document.getElementById('saStandaloneRoot');
  if (!root) { _origShowSuperAdminDashboard(); return; }

  var tenants = typeof getTenants === 'function' ? getTenants() : [];
  _saCurrentTab = 'overview';

  root.innerHTML = '<div class="sa-dashboard"><div class="sa-sidebar" id="saSidebar">'
    + '<div class="sa-sidebar-header"><i class="fas fa-user-shield"></i><span>Super Admin</span></div>'
    + '<div class="sa-sidebar-user">' + (typeof esc === 'function' ? esc(admin.name) : admin.name) + '<br><span style="font-size:11px;color:rgba(255,255,255,0.5);">' + (typeof esc === 'function' ? esc(admin.email) : admin.email) + '</span></div>'
    + '<nav class="sa-nav">'
    + '<a href="javascript:;" class="sa-nav-item active" data-tab="overview" onclick="switchSaTab(\'overview\')"><i class="fas fa-chart-pie"></i><span>Overview</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="schools" onclick="switchSaTab(\'schools\')"><i class="fas fa-school"></i><span>Schools</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="platform" onclick="switchSaTab(\'platform\')"><i class="fas fa-cogs"></i><span>Platform Settings</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="subscriptions" onclick="switchSaTab(\'subscriptions\')"><i class="fas fa-credit-card"></i><span>Subscription Plans</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="analytics" onclick="switchSaTab(\'analytics\')"><i class="fas fa-chart-line"></i><span>Analytics</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="broadcast" onclick="switchSaTab(\'broadcast\')"><i class="fas fa-bullhorn"></i><span>Broadcast</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="revenue" onclick="switchSaTab(\'revenue\')"><i class="fas fa-money-bill-wave"></i><span>Revenue</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="tickets" onclick="switchSaTab(\'tickets\')"><i class="fas fa-headset"></i><span>Support Tickets</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="features" onclick="switchSaTab(\'features\')"><i class="fas fa-toggle-on"></i><span>Feature Flags</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="backup" onclick="switchSaTab(\'backup\')"><i class="fas fa-database"></i><span>Backup &amp; Data</span></a>'
    + '<a href="javascript:;" class="sa-nav-item" data-tab="system" onclick="switchSaTab(\'system\')"><i class="fas fa-server"></i><span>System</span></a>'
    + '</nav>'
    + '<div class="sa-sidebar-footer"><button class="btn btn-sm btn-outline" onclick="saLogout()" style="width:100%;color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2);background:transparent;"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>'
    + '</div><div class="sa-main" id="saMain"><div class="sa-main-header"><h2 id="saPanelTitle">Overview</h2></div><div class="sa-content" id="saContent"></div></div></div>';

  renderSaTab('overview');
};

// SA logout — clears session and shows login
function saLogout() {
  clearSASession();
  showSuperAdminLogin();
}

// Init on DOMContentLoaded
document.addEventListener('DOMContentLoaded', function() {
  var root = document.getElementById('saStandaloneRoot');
  if (!root) return;

  // Ensure data is loaded
  if (typeof loadData === 'function' && typeof data === 'undefined' || data === null) {
    try { data = loadData(); } catch(e) {}
  }

  // Check SA session first (auto-login)
  var session = getSASession();
  if (session && typeof getSuperAdmin === 'function') {
    var admin = getSuperAdmin();
    if (admin && admin.id === session.id) {
      showSuperAdminDashboard();
      return;
    }
  }

  // No session — show login
  if (typeof getSuperAdmin === 'function') {
    if (getSuperAdmin()) {
      showSuperAdminLogin();
    } else {
      showSuperAdminSignup();
    }
  }
});
</script>
