<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — EduVerse</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to EduVerse.">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#f0f4ff 0%,#e0e7ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:#fff;border-radius:16px;padding:48px 40px;width:100%;max-width:480px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1)}
.code{font-size:96px;font-weight:800;color:#2563eb;line-height:1;margin-bottom:4px}
h1{font-size:1.5rem;color:#1e293b;margin-bottom:8px}
p{color:#64748b;font-size:0.9375rem;margin-bottom:24px;line-height:1.5}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-size:0.9375rem;font-weight:600;text-decoration:none;transition:background .2s}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:transparent;border:2px solid #e2e8f0;color:#475569}
.btn-outline:hover{border-color:#2563eb;color:#2563eb}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you are looking for doesn't exist or has been moved. Check the URL or head back to familiar ground.</p>
  <div class="links">
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
    <a href="/schools" class="btn btn-outline"><i class="fas fa-school"></i> Browse Schools</a>
    <a href="/login/student.html" class="btn btn-outline"><i class="fas fa-sign-in-alt"></i> Sign In</a>
  </div>
</div>
</body>
</html>
