<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login — EduVerse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      text-align: center;
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 4px; }
    .subtitle { color: #64748b; font-size: 0.875rem; margin-bottom: 32px; }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dbeafe;
      color: #2563eb;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.875rem;
    }
    .remember { display: flex; align-items: center; gap: 6px; color: #374151; white-space: nowrap; font-size: 0.875rem; }
    .forgot { color: #2563eb; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #d97706; }
    .help-text {
      margin-top: 20px;
      font-size: 0.875rem;
      color: #64748b;
    }
    .help-text a { color: #2563eb; text-decoration: none; }
    .help-text a:hover { text-decoration: underline; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link:hover { color: #2563eb; }
    @media(max-width:480px){ .login-card{ padding:24px 20px; } .subtitle{ margin-bottom:20px; } .options{ flex-direction:column; gap:8px; align-items:flex-start; } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="../icons/icon.svg" alt="EduVerse" onerror="this.parentElement.innerHTML='🎓'">
    </div>
    <h1>EduVerse</h1>
    <p class="subtitle">Welcome Back</p>

    <div class="role-badge">
      <span>👨‍🏫</span> Teacher Portal
    </div>

    <form id="teacherLoginForm">
      <div class="form-group">
        <label for="teacherId">Teacher ID / Username</label>
        <input type="text" id="teacherId" name="teacherId" placeholder="Enter your Teacher ID" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <p class="help-text">
      Don't have access? Contact your school administrator.
    </p>

    <a href="../index.html" class="back-link">← Back to EduVerse</a>
  </div>

  <script>
    document.getElementById('teacherLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const teacherId = document.getElementById('teacherId').value;
      const password = document.getElementById('password').value;
      console.log('Teacher login:', { teacherId, password });
      localStorage.setItem('eduverse_role', 'teacher');
      localStorage.setItem('eduverse_user', teacherId);
      window.location.href = '../?role=teacher&portal=dashboard';
    });
  </script>
</body>
</html>
